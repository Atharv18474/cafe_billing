name: Deploy Frontend to GitHub Pages

on:
  # Run on every push to main branch
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Grant permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        # VITE_BASE_PATH must match your GitHub repo name exactly
        # e.g. if your repo is github.com/YOUR_USERNAME/cafe-pos → /cafe-pos/
        # CHANGE THIS VALUE TO YOUR ACTUAL REPO NAME:
        env:
          VITE_BASE_PATH: /cafe_billing/
          # NOTE: VITE_API_URL is intentionally NOT set here.
          # The frontend will fall back to http://localhost:5000/api by default.
          # When you deploy the backend publicly, add VITE_API_URL as a GitHub Secret
          # and uncomment the next line:
          # VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload dist folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
